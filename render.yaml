services:
  - type: web
    name: family-hub
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -
    healthCheckPath: /events/
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: family-hub-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      # Raise this once HTTPS and the final domain are confirmed working.
      - key: SECURE_HSTS_SECONDS
        value: "0"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_ENDPOINT_URL
        sync: false
      - key: MEDIA_S3_REGION
        sync: false
      - key: MEDIA_S3_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_SECRET_KEY
        sync: false
      - key: MEDIA_PUBLIC_DOMAIN
        sync: false
      - key: STRIPE_PLATFORM_FEE_BPS
        value: "0"
      - key: STRIPE_REFUND_APPLICATION_FEE
        value: "false"

  # Retries emails that failed and queues event reminders.
  - type: cron
    name: family-hub-email
    runtime: python
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_event_reminders && python manage.py retry_email_notifications
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: family-hub
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: family-hub-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: family-hub
          envVarKey: DEFAULT_FROM_EMAIL
      - key: EMAIL_HOST
        fromService:
          type: web
          name: family-hub
          envVarKey: EMAIL_HOST
      - key: EMAIL_HOST_USER
        fromService:
          type: web
          name: family-hub
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: family-hub
          envVarKey: EMAIL_HOST_PASSWORD

databases:
  - name: family-hub-db
    plan: basic-256mb
    databaseName: family_hub
    user: family_hub
