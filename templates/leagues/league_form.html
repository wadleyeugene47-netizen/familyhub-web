{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<div class="container container-form">
  <header class="page-head">
    <a class="back-link" href="{% url 'leagues:organizer_list' %}"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>Your leagues</a>
    <p class="eyebrow">Soccer league</p>
    <h1>{{ heading }}</h1>
    <p class="lead">Set the name, format and season dates. You can add teams and fixtures next.</p>
  </header>
  <form method="post" class="card form-card">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="form-actions">
      <a class="btn btn-ghost" href="{% url 'leagues:organizer_list' %}">Cancel</a>
      <button class="btn btn-primary btn-lg" type="submit">
        <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
        Save league
      </button>
    </div>
  </form>
</div>
{% endblock %}
