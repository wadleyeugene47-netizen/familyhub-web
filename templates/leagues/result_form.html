{% extends "base.html" %}

{% block title %}Record match result{% endblock %}

{% block content %}
<div class="container container-narrow">
  <header class="page-head">
    <a class="back-link" href="{% url 'leagues:manage' league.id %}"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>{{ league.name }}</a>
    <p class="eyebrow">Results</p>
    <h1>Record result</h1>
    <p class="lead">{{ match.home_team.name }} vs {{ match.away_team.name }}</p>
  </header>
  <form method="post" class="card form-card">
    {% csrf_token %}
    <div class="score-grid">
      <div class="field">
        <label for="home_score">{{ match.home_team.name }} score</label>
        <input id="home_score" type="number" min="0" inputmode="numeric" name="home_score" value="{{ match.home_score|default_if_none:'' }}" required>
      </div>
      <span class="vs" aria-hidden="true">–</span>
      <div class="field">
        <label for="away_score">{{ match.away_team.name }} score</label>
        <input id="away_score" type="number" min="0" inputmode="numeric" name="away_score" value="{{ match.away_score|default_if_none:'' }}" required>
      </div>
    </div>
    <div class="form-actions">
      <a class="btn btn-ghost" href="{% url 'leagues:manage' league.id %}">Cancel</a>
      <button class="btn btn-primary btn-lg" type="submit">
        <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
        Save result
      </button>
    </div>
  </form>
</div>
{% endblock %}
