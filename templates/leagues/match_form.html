{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<div class="container container-form">
  <header class="page-head">
    <a class="back-link" href="{% url 'leagues:manage' league.id %}"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>{{ league.name }}</a>
    <p class="eyebrow">Fixtures</p>
    <h1>{{ heading }}: {{ league.name }}</h1>
    <p class="lead">Each match gets its own event page with the venue and a map.</p>
  </header>
  <form method="post" class="card form-card">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="form-actions">
      <a class="btn btn-ghost" href="{% url 'leagues:manage' league.id %}">Cancel</a>
      <button class="btn btn-primary btn-lg" type="submit">
        <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
        Schedule match
      </button>
    </div>
  </form>
</div>
{% endblock %}
